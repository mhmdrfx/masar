name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Test-Path "C:\Program Files\NSIS\makensis.exe")) {
              choco install nsis -y --no-progress
            }
            foreach ($dir in @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS")) {
              if (Test-Path "$dir\makensis.exe") {
                $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Run unit tests
        run: go test ./...

      - name: Build NSIS Windows installer
        run: wails build -nsis -s

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "build\bin\Masar-Setup.exe")) {
            throw "Installer build\bin\Masar-Setup.exe was not generated."
          }
          $hash = (Get-FileHash "build\bin\Masar-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Masar-Setup.exe" | Out-File -FilePath "build\bin\Masar-Setup.exe.sha256" -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/Masar-Setup.exe
            build/bin/Masar-Setup.exe.sha256
