ShortDescription: Native Windows Network Diagnostics, Visual MTR & Route Intelligence Suite
Description: |
  Masar is a lightweight, high-precision network diagnostics and route telemetry
  desktop application engineered natively for Windows 10 and 11 (x64). Built on
  Go and Wails v2 (React / WebView2), it features Visual MTR / traceroute with per-hop
  loss and jitter, continuous speed benchmarking, DNS resolver comparisons, port scanning,
  and exportable ISP diagnostic reports.
